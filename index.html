<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X 转播客</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            padding: 30px 0;
            color: #fff;
        }
        .input-box {
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: #fff;
            font-size: 14px;
        }
        input:focus { outline: 2px solid #e94560; }
        button {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #d63447; }
        button:disabled { background: #555; cursor: not-allowed; }
        .podcast-list { margin-top: 20px; }
        .podcast-item {
            background: #16213e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .podcast-title {
            font-size: 16px;
            margin-bottom: 8px;
            color: #fff;
        }
        .podcast-meta {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .status {
            text-align: center;
            padding: 10px;
            color: #e94560;
        }
        .empty {
            text-align: center;
            color: #666;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎧 X 转播客</h1>
        
        <div class="input-box">
            <input type="text" id="urlInput" placeholder="粘贴 X 视频链接...">
            <button onclick="processVideo()" id="processBtn">开始转换</button>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="podcast-list" id="podcastList">
            <div class="empty">暂无内容，分享链接开始转换</div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'https://x-to-podcast.loca.lt';
        
        async function processVideo() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            
            const btn = document.getElementById('processBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.textContent = '处理中...';
            status.textContent = '📥 下载视频...';
            
            try {
                const res = await fetch(`${API_BASE}/process`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url})
                });
                
                if (!res.ok) throw new Error('处理失败');
                
                const data = await res.json();
                status.textContent = '✅ 转换完成！';
                loadPodcasts();
            } catch (e) {
                status.textContent = '❌ ' + e.message;
            } finally {
                btn.disabled = false;
                btn.textContent = '开始转换';
            }
        }
        
        async function loadPodcasts() {
            try {
                const res = await fetch(`${API_BASE}/list`);
                const podcasts = await res.json();
                
                const list = document.getElementById('podcastList');
                
                if (podcasts.length === 0) {
                    list.innerHTML = '<div class="empty">暂无内容，分享链接开始转换</div>';
                    return;
                }
                
                list.innerHTML = podcasts.map(p => `
                    <div class="podcast-item">
                        <div class="podcast-title">${p.title || 'X 视频'}</div>
                        <div class="podcast-meta">${new Date(p.created_at).toLocaleString('zh-CN')}</div>
                        <audio controls src="${API_BASE}/audio/${p.id}"></audio>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }
        
        // Load on start
        loadPodcasts();
    </script>
</body>
</html>
